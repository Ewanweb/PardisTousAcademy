name: Deploy Laravel App

on:
  push:
    branches:
      - master  # شاخه اصلی پروژه

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        
    
      # ⚙️ دیپلوی توسط FTP
      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.github/**
            **/.editorconfig
            **/README.md

      - name: Run Composer and Artisan remotely
        run: |
          curl -s "http://api.pardistous.ir/build-deploy.php" > /dev/null

